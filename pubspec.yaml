name: hexstead
description: "Cozy medieval hex strategy: 5-minute dice battles vs AI rivals."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  hexstead_engine:
    path: packages/hexstead_engine
  in_app_purchase: ^3.2.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/tiles/
    - assets/images/resources/
    - assets/images/cards/
    - assets/images/landmarks/
    - assets/images/ui/
    - assets/audio/
